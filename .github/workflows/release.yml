name: Release plugins

on:
  push:
    branches: [main]
    paths:
      - "plugins/**"
      - "pack.cs"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency: release

env:
  AURA_REF: v1.4.0

defaults:
  run:
    shell: bash

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: AuraPlugins

      - uses: actions/checkout@v4
        with:
          repository: Nyakaze/AuraPresence
          ref: ${{ env.AURA_REF }}
          path: AuraPresence

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run the plugin checks
        working-directory: AuraPlugins/tests
        run: |
          dotnet run StremioChecks.cs
          dotnet run AniListSyncChecks.cs
          dotnet run MyAnimeListSyncChecks.cs
          dotnet run SimklSyncChecks.cs
          dotnet run NetflixChecks.cs
          dotnet run RobloxChecks.cs
          dotnet run ValorantChecks.cs
          dotnet run LeagueChecks.cs

      - name: Pack and release new versions
        working-directory: AuraPlugins
        env:
          GH_TOKEN: ${{ github.token }}
        run: dotnet run pack.cs -- --publish

      - name: Commit meta.json
        working-directory: AuraPlugins
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add meta.json
          git diff --cached --quiet || { git commit -m "Update meta.json" && git push; }
